        function renderTeamLogo(teamObj, sizeClass = "w-7 h-7 text-xs") {
            let name = typeof teamObj === 'string' ? teamObj : (teamObj?.name || "TEAM");
            let badgeColor = (typeof teamObj === 'object' && teamObj?.color) ? teamObj.color : "bg-val-red text-white";
            
            let words = name.replace(/[^a-zA-Z0-9\s]/g, '').trim().split(/\s+/);
            let initials = "";
            if (words.length >= 2) {
                initials = (words[0][0] + words[1][0]).toUpperCase();
            } else {
                initials = name.substring(0, 3).toUpperCase();
            }

            return `<div class="${sizeClass} ${badgeColor} team-logo-badge shadow flex-shrink-0" title="${name}">${initials}</div>`;
        }

                            <span class="mt-4 text-xs font-bold bg-val-card border border-val-border group-hover:bg-val-red group-hover:text-white px-3 py-1.5 rounded-lg transition w-full">리그 선택</span>
                        </div>
                    </div>
                </div>
            `;
        }

        const formatMoney = (n) => "$" + Math.round(n).toLocaleString();
        const getRoleConfig = (roleId) => ROLES.find(r => r.id === roleId) || ROLES[4];

        function getPhaseName(week) {
            if (week <= 2) return { name: "킥오프 (Kickoff 토너먼트)", type: "kickoff", desc: "시즌 개막 토너먼트" };
            if (week <= 9) return { name: "스테이지 1 (Stage 1 정규리그)", type: "stage1", desc: "8팀 단일 라운드 로빈 — 팀당 7경기" };
            if (week === 10) return { name: "VALORANT Masters 1 (국제대회)", type: "masters1", desc: "Stage 1 상위권 팀이 진출하는 첫 번째 글로벌 마스터즈" };
            if (week <= 17) return { name: "스테이지 2 (Stage 2 정규리그)", type: "stage2", desc: "8팀 단일 라운드 로빈 — 팀당 7경기" };
            if (week === 18) return { name: "VALORANT Masters 2 (국제대회)", type: "masters2", desc: "두 번째 글로벌 마스터즈" };
            if (week === 19) return { name: "VALORANT Champions (최종 챔피언십)", type: "champions", desc: "최종 세계 챔피언십" };
            if (week === 20) return { name: "오프시즌 (Off-Season 이적시장)", type: "offseason", desc: "차기 시즌 대비 선수 영입 및 로스터 재정비 기간" };
            return { name: "시즌 종료", type: "end", desc: "시즌 마감" };
        }

        function initGame(regionKey, tier, teamObj) {
            const regData = VCT_DATA[regionKey];
            const isT1 = tier === 1;
            
            const t1Teams = regData.t1.map(t => ({ name: t.name, color: t.color, power: t.power, w: 0, l: 0 }));
            const t2Teams = regData.t2.map(t => ({ name: t.name, color: t.color, power: t.power, academy: !!t.academy, w: 0, l: 0 }));

            let players = teamObj.roster.map((p, idx) => ({
                id: 'p_' + Math.random().toString(36).substr(2, 9),
                name: p.name,
                role: p.role,
                agent: p.agent,
                ovr: p.ovr,
                salary: p.salary,
                isStarter: true,
                stats: { matches: 0, kills: 0, deaths: 0, assists: 0, acsSum: 0, mvpCount: 0 }
            }));

            let freeAgents = [];
            let namePool = [...INITIAL_NAMES].sort(() => Math.random() - 0.5);
            for (let i = 0; i < 14; i++) {
                const roleObj = ROLES[Math.floor(Math.random() * 5)];
                freeAgents.push({
                    id: 'fa_' + Math.random().toString(36).substr(2, 9),
                    name: namePool[i] || `FA_Agent_${i+1}`,
                    role: roleObj.id,
                    agent: roleObj.agents[Math.floor(Math.random() * roleObj.agents.length)],
                    ovr: 74 + Math.floor(Math.random() * 16),
                    salary: 32000 + Math.floor(Math.random() * 25000),
                    stats: { matches: 0, kills: 0, deaths: 0, assists: 0, acsSum: 0, mvpCount: 0 }
                });
            }

            const youth = [];
            const youthPool = ["Nova", "Rin", "Milo", "Kite", "Vex", "Ari", "Nox", "Lumi"];
            for (let i = 0; i < 4; i++) {
                const roleObj = ROLES[Math.floor(Math.random() * 5)];
                youth.push({ id: 'y_' + Math.random().toString(36).substr(2, 9), name: youthPool[i] + Math.floor(10 + Math.random() * 90), role: roleObj.id, agent: roleObj.agents[Math.floor(Math.random() * roleObj.agents.length)], ovr: 60 + Math.floor(Math.random() * 10), potential: 82 + Math.floor(Math.random() * 17), age: 16 + Math.floor(Math.random() * 3), training: 0, salary: 18000 + Math.floor(Math.random() * 12000), stats: { matches: 0, kills: 0, deaths: 0, assists: 0, acsSum: 0, mvpCount: 0 } });
            }

            state = {
                year: 2026,
                regionKey: regionKey,
                regionName: regData.name,
                tier: tier,
                myTeamName: teamObj.name,
                myTeamColor: teamObj.color || "bg-val-red text-white",
                week: 1,
                cash: isT1 ? 850000 : 550000,
                reputation: isT1 ? 60 : 35,
                fan: isT1 ? 45 : 20,
                form: 60,
                morale: 70,
                coach: 45,
                analyst: 40,
                trainingDone: false,
                players: players,
                maxRoster: 6,
                startersRequired: 5,
                freeAgents: freeAgents,
                youth: youth,
                youthLevel: 1,
                t1Teams: t1Teams,
                t2Teams: t2Teams,
                lastMatchReport: null,
                logs: [`[2026 시즌 개막] ${regData.name} ${tier}부 리그의 ${teamObj.name} 감독으로 부임하셨습니다.`]
            };

            renderApp();
        }

        function getStartingPlayers() {
            if (!state || !Array.isArray(state.players)) return [];
            const starters = state.players.filter(p => p.isStarter !== false);
            return starters.slice(0, 5);
        }

        function calculateTeamPower() {
            const starters = getStartingPlayers();
            if (starters.length === 0) return 0;
            const avgOvr = starters.reduce((sum, p) => sum + p.ovr, 0) / starters.length;
            return Math.round(avgOvr * 0.75 + (state.form * 0.15) + (state.morale * 0.05) + (state.coach * 0.05));
        }

        function simulateCpuMatches(userOpponentName = null) {
            const currentTeams = state.tier === 1 ? state.t1Teams : state.t2Teams;
            const cpuTeams = currentTeams.filter(t => t.name !== state.myTeamName && t.name !== userOpponentName);
            const shuffled = [...cpuTeams].sort(() => Math.random() - 0.5);

            for (let i = 0; i < shuffled.length - 1; i += 2) {
                const teamA = shuffled[i];
                const teamB = shuffled[i+1];

                const powerA = teamA.power + (Math.random() * 24 - 12);
                const powerB = teamB.power + (Math.random() * 24 - 12);

                if (powerA >= powerB) {
                    teamA.w++;
                    teamB.l++;
                } else {
                    teamB.w++;
                    teamA.l++;
                }
            }
        }

        function checkTop4Qualification() {
            const currentTeams = state.tier === 1 ? state.t1Teams : state.t2Teams;
            let sortedTeams = [...currentTeams].filter(t => !t.academy).sort((a, b) => (b.w - a.w) || (b.power - a.power));
            const myRank = sortedTeams.findIndex(t => t.name === state.myTeamName) + 1;
            return myRank > 0 && myRank <= 4;
        }

        function playMatch() {
            if (getStartingPlayers().length < 5) {
                showToast("선발 5명이 필요합니다. 로스터에서 식스맨을 교체해 주세요.");
                navigate('market');
                return;
            }
            if (state.week > 20) {
                showToast("모든 시즌 일정이 종료되었습니다.");
                return;
            }

            const phase = getPhaseName(state.week);
            if (phase.type === 'offseason') {
                showToast("오프시즌 기간입니다. 차기 시즌으로 진입해주세요.");
                return;
            }

            const isInternational = phase.type === 'masters1' || phase.type === 'masters2' || phase.type === 'champions';
            const isQualified = checkTop4Qualification();

            if (isInternational && !isQualified) {
                showToast("상위 4위 안에 들지 못해 국제대회 진출이 좌절되었습니다. 이번 주는 시뮬레이션으로 넘어갑니다.");
                state.logs.push(`⚠️ [${state.year} ${phase.name}] 상위 4위 진입 실패로 인해 국제대회에 참가하지 못하고 휴식을 가졌습니다.`);
                advanceWeek(true);
                return;
            }

            const currentTeams = state.tier === 1 ? state.t1Teams : state.t2Teams;
            const myTeamRef = currentTeams.find(t => t.name === state.myTeamName);
            const opponents = currentTeams.filter(t => t.name !== state.myTeamName);
            const opp = opponents[Math.floor(Math.random() * opponents.length)];

            if (!isInternational) {
                simulateCpuMatches(opp.name);
            }

            let myMapsWon = 0;
            let oppMapsWon = 0;
            let playedMaps = [];
            const shuffledMaps = [...MAP_POOL].sort(() => Math.random() - 0.5);

            for (let i = 0; i < 3; i++) {
                if (myMapsWon === 2 || oppMapsWon === 2) break;

                const myPower = calculateTeamPower();
                const oppPower = isInternational ? (opp.power + 4 + (state.year - 2026) * 1) : opp.power;

                const powerDiff = myPower - oppPower;
                const winProbability = 1 / (1 + Math.pow(10, -powerDiff / 25));
                const randomRoll = Math.random();

                let myRounds = 0;
                let oppRounds = 0;

                if (randomRoll < winProbability) {
                    myRounds = 13;
                    oppRounds = Math.max(3, Math.floor(13 - (winProbability * 10) - (Math.random() * 5)));
                    if (oppRounds >= 13) oppRounds = 12;
                    myMapsWon++;
                } else {
                    oppRounds = 13;
                    myRounds = Math.max(3, Math.floor(13 - ((1 - winProbability) * 10) - (Math.random() * 5)));
                    if (myRounds >= 13) myRounds = 12;
                    oppMapsWon++;
                }

                playedMaps.push({
                    mapIndex: i + 1,
                    mapName: shuffledMaps[i],
                    myScore: myRounds,
                    oppScore: oppRounds
                });
            }

            const isWin = myMapsWon > oppMapsWon;

            let matchPlayerStats = [];
            let highestAcs = -1;
            let mvpIndex = 0;

            getStartingPlayers().forEach((p, idx) => {
                const baseKills = Math.floor(12 + (p.ovr - 75) * 0.6 + (Math.random() * 8 - 4));
                const deaths = Math.max(5, Math.floor(13 + (78 - p.ovr) * 0.3 + (Math.random() * 6 - 3)));
                const assists = Math.floor(3 + Math.random() * 7);
                const acs = Math.floor(baseKills * 12 + assists * 6 + (Math.random() * 20 - 10));

                if (acs > highestAcs) {
                    highestAcs = acs;
                    mvpIndex = idx;
                }

                matchPlayerStats.push({
                    name: p.name,
                    agent: p.agent,
                    kills: baseKills,
                    deaths: deaths,
                    assists: assists,
                    acs: acs,
                    kd: deaths > 0 ? (baseKills / deaths).toFixed(2) : baseKills,
                    isMvp: false
                });

                p.stats.matches++;
                p.stats.kills += baseKills;
                p.stats.deaths += deaths;
                p.stats.assists += assists;
                p.stats.acsSum += acs;
            });

            matchPlayerStats[mvpIndex].isMvp = true;
            getStartingPlayers()[mvpIndex].stats.mvpCount++;

            if (!isInternational) {
                if (isWin) {
                    myTeamRef.w++;
                    opp.l++;
                } else {
                    myTeamRef.l++;
                    opp.w++;
                }
            }

            if (isWin) {
                state.form = Math.min(100, state.form + 3);
                state.morale = Math.min(100, state.morale + 4);
                state.fan = Math.min(100, state.fan + 3);
                state.reputation = Math.min(100, state.reputation + 2);
                state.logs.push(`🟩 [${state.year} ${phase.name}] 승리 (2-${oppMapsWon}) — ${opp.name} 구단을 상대로 승리했습니다!`);
                showToast(`${phase.name} 경기 승리! 🎉`);
            } else {
                state.form = Math.max(0, state.form - 2);
                state.morale = Math.max(0, state.morale - 2);
                state.logs.push(`🟥 [${state.year} ${phase.name}] 패배 (${myMapsWon}-2) — ${opp.name}에게 아쉽게 패배했습니다.`);
                showToast(`${phase.name} 경기 패배...`);
            }

            let prize = isWin ? (state.tier === 1 ? 35000 : 18000) : (state.tier === 1 ? 14000 : 7000);
            if (phase.type === 'masters1' || phase.type === 'masters2') prize *= 2.0;
            if (phase.type === 'champions') prize *= 4.0;
            state.cash += prize;

            state.lastMatchReport = {
                oppName: opp.name,
                myMapsWon: myMapsWon,
                oppMapsWon: oppMapsWon,
                isWin: isWin,
                maps: playedMaps,
                playerStats: matchPlayerStats
            };

            advanceWeek(true);
        }

        function advanceWeek(fromMatch = false) {
            if (state.week >= 20 && !fromMatch) {
                if (state.year >= 2030) {
                    openModal(`
                        <div class="text-center flex flex-col gap-4">
                            <div class="text-5xl">🏆</div>
                            <h2 class="text-2xl font-black text-white">2030년 챔피언십 대장정 완료</h2>
                            <p class="text-sm text-val-muted">2026년부터 2030년까지 5년간의 감독 커리어가 명예롭게 마무리되었습니다!</p>
                            <button class="bg-val-red text-white font-bold py-2.5 rounded-xl mt-2" onclick="location.reload()">새 게임 시작하기</button>
                        </div>
                    `);
                    return;
                } else {
                    state.year++;
                    state.week = 1;
                    state.trainingDone = false;
                    state.t1Teams.forEach(t => { t.w = 0; t.l = 0; t.power += 1; });
                    state.t2Teams.forEach(t => { t.w = 0; t.l = 0; t.power += 1; });
                    generateYouthProspects(2);
                    state.logs.push(`📢 [${state.year} 시즌 개막] 새로운 한 해가 시작되었습니다! 팀 전력이 상향되었습니다.`);
                    showToast(`${state.year}년 새 시즌이 개막했습니다!`);
                    renderApp();
                    return;
                }
            }

            if (!fromMatch) {
                const curPhase = getPhaseName(state.week);
                if (curPhase.type === 'offseason') {
                    state.week = 20;
                } else if (curPhase.type !== 'masters1' && curPhase.type !== 'masters2' && curPhase.type !== 'champions') {
                    simulateCpuMatches(null);
                }
            }

            state.week++;
            state.trainingDone = false;
            if (Array.isArray(state.youth)) state.youth.forEach(y => { if (y.ovr < y.potential && Math.random() < 0.18 + state.youthLevel * 0.04) y.ovr = Math.min(y.potential, y.ovr + 1); });

            const weeklyWages = Math.round(state.players.reduce((sum, p) => sum + p.salary, 0) / 52);
            const fixedCost = state.tier === 1 ? 40000 : 20000;
            state.cash -= (fixedCost + weeklyWages);

            if (state.cash < 0) {
                state.morale = Math.max(0, state.morale - 6);
                state.logs.push("⚠ 경고: 구단 자금 부족으로 인해 선수단 사기가 크게 하락했습니다.");
            }

            const newPhase = getPhaseName(state.week);
            if (state.week === 10) {
                const isQualified = checkTop4Qualification();
                state.logs.push(`🌍 [${state.year} Masters 1] 개막! (상위 4팀 진출 여부: ${isQualified ? '성공' : '실패'})`);
                openModal(`
                    <div class="text-center flex flex-col gap-4">
                        <div class="text-4xl">🌍</div>
                        <h2 class="text-2xl font-black text-val-accent">VALORANT Masters 1 개막!</h2>
                        <p class="text-sm text-val-muted">현재 리그 순위 기준 <b>상위 4개 팀</b>만 참가할 수 있는 첫 번째 마스터즈입니다!<br>내 팀 진출 상태: <span class="${isQualified ? 'text-green-400 font-bold' : 'text-val-red font-bold'}">${isQualified ? '진출 성공 (TOP 4)' : '진출 실패'}</span></p>
                        <button class="bg-val-red text-white font-bold py-2 rounded-lg" onclick="closeModal()">확인</button>
                    </div>
                `);
            } else if (state.week === 18) {
                const isQualified = checkTop4Qualification();
                state.logs.push(`🌍 [${state.year} Masters 2] 개막! (상위 4팀 진출 여부: ${isQualified ? '성공' : '실패'})`);
                openModal(`
                    <div class="text-center flex flex-col gap-4">
                        <div class="text-4xl">🌍</div>
                        <h2 class="text-2xl font-black text-val-accent">VALORANT Masters 2 개막!</h2>
                        <p class="text-sm text-val-muted">스테이지 1 종료 후 상위 4개 팀만 참가하는 두 번째 마스터즈 무대입니다!<br>내 팀 진출 상태: <span class="${isQualified ? 'text-green-400 font-bold' : 'text-val-red font-bold'}">${isQualified ? '진출 성공 (TOP 4)' : '진출 실패'}</span></p>
                        <button class="bg-val-red text-white font-bold py-2 rounded-lg" onclick="closeModal()">확인</button>
                    </div>
                `);
            } else if (state.week === 19) {
                const isQualified = checkTop4Qualification();
                state.logs.push(`🏆 [${state.year} Champions] 최종 월드 챔피언십 개막! (상위 4팀 진출 여부: ${isQualified ? '성공' : '실패'})`);
                openModal(`
                    <div class="text-center flex flex-col gap-4">
                        <div class="text-5xl">👑</div>
                        <h2 class="text-2xl font-black text-yellow-400">VALORANT Champions 개막!</h2>
                        <p class="text-sm text-val-muted">스테이지 2까지의 성적 기준 상위 4개 팀만 참가하는 최종 왕중왕전 무대입니다!<br>내 팀 진출 상태: <span class="${isQualified ? 'text-green-400 font-bold' : 'text-val-red font-bold'}">${isQualified ? '진출 성공 (TOP 4)' : '진출 실패'}</span></p>
                        <button class="bg-val-red text-white font-bold py-2 rounded-lg" onclick="closeModal()">확인</button>
                    </div>
                `);
            } else if (state.week === 20) {
                state.logs.push(`🔄 [${state.year} 오프시즌] 이적시장 및 로스터 재정비 기간이 시작되었습니다.`);
                let namePool = [...INITIAL_NAMES].sort(() => Math.random() - 0.5);
                state.freeAgents = [];
                for (let i = 0; i < 12; i++) {
                    const roleObj = ROLES[Math.floor(Math.random() * 5)];
                    state.freeAgents.push({
                        id: 'fa_' + Math.random().toString(36).substr(2, 9),
                        name: namePool[i] || `FA_Agent_${i+1}`,
                        role: roleObj.id,
                        agent: roleObj.agents[Math.floor(Math.random() * roleObj.agents.length)],
                        ovr: 75 + Math.floor(Math.random() * 16) + Math.floor((state.year - 2026) * 0.5),
                        salary: 35000 + Math.floor(Math.random() * 25000),
                        stats: { matches: 0, kills: 0, deaths: 0, assists: 0, acsSum: 0, mvpCount: 0 }
                    });
                }
                openModal(`
                    <div class="text-center flex flex-col gap-4">
                        <div class="text-4xl">🔄</div>
                        <h2 class="text-2xl font-black text-white">${state.year} 오프시즌 돌입</h2>

                        <button class="bg-val-red text-white font-bold py-2 rounded-lg" onclick="closeModal()">확인</button>
                    </div>
                `);
            } else if (!fromMatch) {
                state.logs.push(`⏳ ${state.year}년 ${state.week}주차 (${newPhase.name})가 시작되었습니다.`);
            }

            renderApp();
        }

        function signPlayer(index) {
            if (!state || !Array.isArray(state.players) || !Array.isArray(state.freeAgents)) return;
            if (state.players.length >= 6) {
                showToast("로스터가 가득 찼습니다. 먼저 선수를 방출하세요.");
                return;
            }
            if (index < 0 || index >= state.freeAgents.length) {
                showToast("해당 선수를 찾을 수 없습니다.");
                return;
            }
            const p = state.freeAgents[index];
            if (!p) return;
            p.isStarter = state.players.length < 5;
            const fee = Math.round((p.salary || 0) * 0.4);

            if (state.cash < fee) {
                showToast("계약금이 부족합니다!");
                return;
            }

            state.cash -= fee;
            state.players.push(p);
            state.freeAgents.splice(index, 1);
            state.logs.push(`[영입] ${p.name} (${p.role}, OVR ${p.ovr}) 영입 완료.`);
            showToast(`${p.name} 영입 성공!`);
            renderApp();
        }

        function toggleSixthMan(index) {
            if (!state || !Array.isArray(state.players)) return;
            const target = state.players[index];
            if (!target) return;

            const benchIndex = state.players.findIndex(p => p.isStarter === false);
            if (target.isStarter === false) {
                // 식스맨을 선발로 올리고, 현재 선발 중 가장 마지막 선수를 식스맨으로 내립니다.
                const starterIndex = state.players.findIndex((p, i) => p.isStarter !== false && i !== index);
                if (starterIndex < 0) return;
                state.players[starterIndex].isStarter = false;
                target.isStarter = true;
                showToast(`${target.name} 선발 출전 · ${state.players[starterIndex].name} 식스맨`);
            } else {
                if (benchIndex < 0) {
                    if (state.players.length >= 6) {
                        showToast('식스맨 자리가 이미 없습니다.');
                        return;
                    }
                    target.isStarter = true;
                    showToast('현재 식스맨이 없습니다. FA에서 6번째 선수를 영입하세요.');
                    return;
                }
                const bench = state.players[benchIndex];
                target.isStarter = false;
                bench.isStarter = true;
                showToast(`${target.name} 식스맨 · ${bench.name} 선발 출전`);
            }
            renderApp();
        }

        function releasePlayer(index) {
            // 교체 영입을 위해 4명까지는 일시적으로 허용합니다.
            // 5명 로스터에서 방출 -> 새 선수 영입 순서로 정상적인 교체가 가능합니다.
            if (!state || !Array.isArray(state.players)) return;
            if (index < 0 || index >= state.players.length) return;
            if (state.players.length <= 5) {
                showToast("최소 5명은 유지해야 합니다.");
                return;
            }

            const p = state.players[index];
            state.players.splice(index, 1);

            // 방출 선수는 FA 시장으로 이동시켜 다시 영입할 수 있게 합니다.
            if (!Array.isArray(state.freeAgents)) state.freeAgents = [];
            state.freeAgents.unshift(p);

            // 잔여 계약 보상금 15%
            state.cash += Math.round((p.salary || 0) * 0.15);
            state.logs.push(`[방출] ${p.name} 선수와의 계약을 해지했습니다. FA 시장으로 이동했습니다.`);
            showToast(`${p.name} 방출 완료. FA 시장에서 다시 영입할 수 있습니다.`);
            renderApp();
        }

        function doTrain(type) {
            if (state.trainingDone) {
                showToast("이번 주 훈련은 이미 마쳤습니다.");
                return;
            }
            state.trainingDone = true;

            if (type === 'aim') state.form = Math.min(100, state.form + 4);
            else if (type === 'tactic') { state.form = Math.min(100, state.form + 2); state.coach = Math.min(100, state.coach + 2); }
            else if (type === 'team') state.morale = Math.min(100, state.morale + 6);

            state.logs.push("이번 주 팀 주간 훈련을 성공적으로 마쳤습니다.");
            showToast("훈련 완료!");
            renderApp();
        }

        function upgradeStaff(type) {
            if (type === 'coach') {
                if (state.cash >= 55000) {
                    state.cash -= 55000;
                    state.coach = Math.min(100, state.coach + 10);
                    state.logs.push("코치진 연수를 지원하여 코칭 능력이 상승했습니다.");
                    showToast("코치 능력 상승!");
                    renderApp();
                } else showToast("자금이 부족합니다!");
            } else if (type === 'analyst') {
                if (state.cash >= 40000) {
                    state.cash -= 40000;
                    state.analyst = Math.min(100, state.analyst + 10);
                    state.logs.push("분석 시스템을 도입하여 데이터 분석력이 상승했습니다.");
                    showToast("분석력 상승!");
                    renderApp();
                } else showToast("자금이 부족합니다!");
            }
        }

        function signSponsor(type) {
            const amount = type === 1 ? 70000 : 150000;
            state.cash += amount;
            state.reputation = Math.min(100, state.reputation + (type === 2 ? 3 : 1));
            state.logs.push(`[스폰서] ${type === 2 ? '글로벌 테크' : '지역 게이밍'} 스폰서 계약 완료 (+${formatMoney(amount)})`);
            showToast("스폰서 계약 완료!");
            renderApp();
        }

        window.onload = () => {
            try {
                renderApp();
            } catch (e) {
                console.error(e);
                document.getElementById('app').innerHTML = `
                    <div class="bg-val-panel border border-val-red text-white p-6 rounded-xl">
                        <h2 class="text-xl font-bold mb-2">실행 오류 발생</h2>
                        <p class="text-xs text-val-muted">${e.message}</p>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
